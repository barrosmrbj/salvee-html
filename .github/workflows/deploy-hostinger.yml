# Gera o build do frontend a cada push na master e publica o conteúdo de dist/
# na branch "hostinger". A Hostinger (Git → public_html) deve apontar para essa branch:
# ela não roda build, só copia os arquivos.
name: Build para Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # usa o .env.production (VITE_API_URL de produção)
      - run: npm run build

      - name: Publicar dist/ na branch hostinger
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
