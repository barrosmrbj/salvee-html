<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <circle cx="380" cy="0" r="100" fill="white" fill-opacity="0.06"/>
  <circle cx="30" cy="200" r="120" fill="white" fill-opacity="0.04"/>
  <!-- snowflake large -->
  <g transform="translate(300,80)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55">
    <line x1="0" y1="-50" x2="0" y2="50"/>
    <line x1="-43" y1="-25" x2="43" y2="25"/>
    <line x1="43" y1="-25" x2="-43" y2="25"/>
    <line x1="0" y1="-50" x2="-14" y2="-36"/>
    <line x1="0" y1="-50" x2="14" y2="-36"/>
    <line x1="0" y1="50" x2="-14" y2="36"/>
    <line x1="0" y1="50" x2="14" y2="36"/>
    <line x1="-43" y1="-25" x2="-35" y2="-12"/>
    <line x1="-43" y1="-25" x2="-29" y2="-25"/>
    <line x1="43" y1="25" x2="35" y2="12"/>
    <line x1="43" y1="25" x2="29" y2="25"/>
  </g>
  <!-- snowflake medium -->
  <g transform="translate(80,50)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35">
    <line x1="0" y1="-28" x2="0" y2="28"/>
    <line x1="-24" y1="-14" x2="24" y2="14"/>
    <line x1="24" y1="-14" x2="-24" y2="14"/>
    <line x1="0" y1="-28" x2="-8" y2="-20"/>
    <line x1="0" y1="-28" x2="8" y2="-20"/>
    <line x1="0" y1="28" x2="-8" y2="20"/>
    <line x1="0" y1="28" x2="8" y2="20"/>
  </g>
  <!-- snowflake small -->
  <g transform="translate(180,160)" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.28">
    <line x1="0" y1="-18" x2="0" y2="18"/>
    <line x1="-16" y1="-9" x2="16" y2="9"/>
    <line x1="16" y1="-9" x2="-16" y2="9"/>
  </g>
  <!-- snowflake tiny -->
  <g transform="translate(360,155)" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.25">
    <line x1="0" y1="-12" x2="0" y2="12"/>
    <line x1="-10" y1="-6" x2="10" y2="6"/>
    <line x1="10" y1="-6" x2="-10" y2="6"/>
  </g>
  <!-- snow dots -->
  <circle cx="140" cy="90" r="3" fill="white" fill-opacity="0.35"/>
  <circle cx="220" cy="40" r="2.5" fill="white" fill-opacity="0.30"/>
  <circle cx="370" cy="150" r="2" fill="white" fill-opacity="0.25"/>
  <circle cx="50" cy="130" r="2" fill="white" fill-opacity="0.25"/>
  <circle cx="250" cy="170" r="3" fill="white" fill-opacity="0.28"/>
  <!-- coat silhouette -->
  <g fill="white" fill-opacity="0.14">
    <path d="M30 80 L10 130 L20 130 L25 110 L25 160 L65 160 L65 110 L70 130 L80 130 L60 80 L52 90 L45 82 L38 90 Z"/>
  </g>
  <!-- INVERNO text large faint -->
  <text x="-5" y="185" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="90" fill="white" fill-opacity="0.07">INVERNO</text>
</svg>
