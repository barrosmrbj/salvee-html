<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#F97316"/>
  <!-- sun rays -->
  <g stroke="white" stroke-width="6" stroke-linecap="round">
    <line x1="100" y1="42" x2="100" y2="58"/>
    <line x1="100" y1="142" x2="100" y2="158"/>
    <line x1="42" y1="100" x2="58" y2="100"/>
    <line x1="142" y1="100" x2="158" y2="100"/>
    <line x1="58" y1="58" x2="69" y2="69"/>
    <line x1="131" y1="131" x2="142" y2="142"/>
    <line x1="142" y1="58" x2="131" y2="69"/>
    <line x1="58" y1="142" x2="69" y2="131"/>
  </g>
  <!-- sun circle -->
  <circle cx="100" cy="100" r="32" fill="white"/>
  <!-- bulb shape inside -->
  <circle cx="100" cy="95" r="18" fill="#F97316"/>
  <rect x="93" y="113" width="14" height="8" rx="2" fill="#F97316"/>
  <rect x="91" y="121" width="18" height="4" rx="2" fill="#F97316"/>
  <rect x="93" y="125" width="14" height="4" rx="2" fill="#F97316"/>
</svg>
