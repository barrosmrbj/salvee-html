<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#10B981"/>
  <!-- tree trunk -->
  <rect x="93" y="120" width="14" height="40" rx="4" fill="white"/>
  <!-- roots -->
  <g stroke="white" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M93 155 Q75 160 65 155"/>
    <path d="M107 155 Q125 160 135 155"/>
    <path d="M100 158 Q100 168 100 170"/>
  </g>
  <!-- canopy -->
  <circle cx="100" cy="95" r="40" fill="white"/>
  <circle cx="70" cy="110" r="25" fill="white"/>
  <circle cx="130" cy="110" r="25" fill="white"/>
  <!-- leaf vein -->
  <g stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="100" y1="75" x2="100" y2="115"/>
    <line x1="100" y1="90" x2="85" y2="100"/>
    <line x1="100" y1="100" x2="115" y2="110"/>
  </g>
</svg>
